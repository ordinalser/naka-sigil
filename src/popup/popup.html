<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Naka Sigil</title>
  <link rel="stylesheet" href="popup.css"><link rel="stylesheet" href="../lib/purchase.css">
</head>
<body>
  <header class="head">
    <button id="lookupBack" class="lookup-back" type="button" hidden></button>
    <div id="sigil" class="sigil-frame" aria-hidden="true"></div>
    <div class="brand"><h1 id="title"></h1><p id="tagline" class="sub"></p></div>
    <div id="langSwitch" class="segmented" role="group" aria-label="Language / 语言">
      <button type="button" data-lang="zh">中文</button><button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <main class="popup-scroll">
  <section id="viewHome" class="view view-home">
    <button id="statusStrip" class="status-strip" type="button"></button>
    <section class="holdings-hero" aria-labelledby="holdingsTitle">
      <h2 id="holdingsTitle" class="sr-only"></h2>
      <div id="holdingsFigure" class="hc-figure"></div>
    </section>
    <section id="holdingsEmpty" class="holdings-empty" hidden>
      <div class="empty-preview" aria-hidden="true"><div id="emptyFigure" class="empty-figure"></div><div class="empty-tiles"><i></i><i></i><i></i><i></i></div></div>
      <div class="empty-copy"><h2 id="emptyTitle"></h2><p id="emptyText"></p></div>
      <button id="emptyAdd" class="btn empty-add" type="button"></button>
      <p id="emptyOr" class="empty-or"></p>
      <div id="emptyJumps" class="empty-jumps"></div>
      <p id="emptyNote" class="hc-how empty-note"></p>
    </section>
    <section id="holdingsList" class="holdings-list">
      <div class="list-head"><h3 id="tilesTitle"></h3><span class="list-actions"><button id="raiseOpen" class="list-link" type="button"></button><button id="holdingsManage" class="list-link" type="button"></button><button id="holdingsAdd" class="list-add" type="button"></button></span></div>
      <div id="holdingsTiles" class="hc-tiles"></div>
      <button id="holdingsMore" class="hc-more" type="button" hidden></button>
    </section>
  </section>

  <section id="viewExplore" class="view view-explore" hidden>
    <section class="lookup-section" aria-labelledby="lookupTitle">
      <form id="lookupForm">
        <div class="lookup-heading"><label id="lookupTitle" class="px-title" for="lookupNumber"></label><button id="historyLookup" class="text-btn" type="button"></button></div>
        <div class="lookup-controls"><span class="lookup-prefix" aria-hidden="true">#</span><input id="lookupNumber" class="field" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="24"><button id="lookupBtn" class="btn" type="submit"></button></div>
      </form>
      <p id="lookupHow" class="lookup-how"></p>
      <div id="lookupResult" aria-live="polite" hidden></div>
      <div id="lookupActions" class="lookup-actions" hidden><button id="lookupCompare" class="lookup-compare" type="button"></button><button id="lookupHolding" class="lookup-compare lookup-holding" type="button"></button></div>
    </section>
    <section class="compare-panel" aria-labelledby="compareTitle">
      <div class="compare-head"><h2 id="compareTitle" class="px-title"></h2><span id="comparePips" class="pips" aria-hidden="true"></span><span id="compareCount" class="hc-count"></span><button id="compareAdd" class="hc-manage" type="button"></button></div>
      <div id="compareList" class="compare-list"></div>
      <button id="compare" class="compare-open" type="button"></button>
    </section>
  </section>

  <section id="viewBlock" class="view view-block" hidden>
    <div class="mode-row"><span id="liveTitle" class="sr-only"></span><div class="mode-options" role="group" aria-labelledby="liveTitle"><button id="modeLive" type="button"></button><button id="modeFixed" type="button"></button></div><span id="liveState" class="live-state" role="status"></span></div>
    <section class="snapshot-card" aria-labelledby="snapTitle">
      <h2 id="snapTitle" class="sr-only"></h2>
      <div class="height-line"><span id="heightLabel"></span><strong id="currentHeight"></strong><span id="snapSource" class="source-chip"></span></div>
      <p class="block-meta"><span id="blockAge" class="block-age"></span></p>
      <dl id="snap" class="snapshot-stats"></dl>
    </section>
    <section class="block-card"><div class="block-card-head"><h3 id="allocTitleBlock" class="px-title"></h3><span id="allocNote" class="hc-count"></span></div><dl id="allocStats" class="alloc-stats"></dl></section>
    <section class="block-card"><div class="block-card-head"><h3 id="scheduleTitle" class="px-title"></h3><span id="weeksDone" class="hc-count"></span></div><div id="weekBar" class="week-bar" aria-hidden="true"><i></i></div><dl id="schedule" class="schedule"></dl></section>
  </section>

  <section id="viewAbout" class="view view-about" hidden>
    <section class="about-safe"><h2 id="safeTitle"></h2><div id="aboutSafe"></div></section>
    <div class="about-folds">
      <details class="about-fold"><summary><h2 id="allocTitle"></h2></summary><div id="aboutAlloc" class="about-body"></div></details>
      <details class="about-fold"><summary><h2 id="rulesTitle"></h2></summary><div class="about-body"><div id="aboutRules"></div><p id="listedNote"></p><p id="measureNote" role="note"></p></div></details>
      <details class="about-fold"><summary><h2 id="dataTitle"></h2></summary><div class="about-body"><div id="aboutData"></div><p class="about-links"><a id="open" target="_blank" rel="noopener noreferrer"></a></p></div></details>
    </div>
  </section>
  </main>

  <nav id="tabbar" class="tabbar" aria-label="Sections">
    <button type="button" data-view="home"><span class="tab-icon"></span><span class="tab-label"></span></button>
    <button type="button" data-view="block"><span class="tab-icon"></span><span class="tab-label"></span></button>
    <button type="button" data-view="explore"><span class="tab-icon"></span><span class="tab-label"></span><span id="compareBadge" class="tab-badge" hidden></span></button>
    <button type="button" data-view="about"><span class="tab-icon"></span><span class="tab-label"></span></button>
  </nav>
  <dialog id="addDialog" aria-labelledby="addTitle">
    <form id="addForm"><h2 id="addTitle"></h2><div class="add-field"><span class="lookup-prefix" aria-hidden="true">#</span><input id="addInput" class="field" type="text" autocomplete="off" spellcheck="false" maxlength="400"></div><p id="addHint" class="add-hint"></p><p id="addError" class="inline-error" role="alert"></p><div class="fixed-actions"><button id="addCancel" class="text-btn" type="button"></button><button id="addSubmit" class="btn" type="submit"></button></div></form>
  </dialog>
  <dialog id="fixedDialog" aria-labelledby="fixedTitle">
    <h2 id="fixedTitle"></h2><p id="syncHint" class="footnote"></p>
    <label id="boundaryLabel" class="fixed-label" for="rewardBoundary"></label><select id="rewardBoundary" class="field"></select><p id="boundaryClock" class="footnote"></p>
    <div id="fixedControls"><form id="syncForm"><label id="fixedHeightLabel" class="fixed-label" for="syncHeight"></label><input id="syncHeight" class="field" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="12"><div id="historyNumberRow" hidden><label id="historyNumberLabel" class="fixed-label" for="historyNumber"></label><input id="historyNumber" class="field" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="24"></div><div class="fixed-actions"><button id="fixedCancel" class="text-btn" type="button"></button><button id="syncBtn" class="btn" type="submit"></button></div></form></div>
    <p id="syncStatus" class="footnote status" role="status" aria-live="polite" hidden></p>
  </dialog>
  <script src="../data/snapshot.js"></script><script src="../lib/rules.js"></script>
  <script src="../lib/tier.js"></script><script src="../lib/purchase.js"></script><script src="../lib/portfolio.js"></script><script src="../lib/lookup.js"></script><script src="../lib/pixel.js"></script><script src="../lib/i18n.js"></script><script src="../lib/source.js"></script><script src="../lib/explore.js"></script><script src="../lib/explore-ui.js"></script><script src="../lib/rewards.js"></script><script src="popup.js"></script>
</body>
</html>
