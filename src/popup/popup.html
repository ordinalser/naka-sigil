<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Naka Sigil</title>
  <link rel="stylesheet" href="popup.css"><link rel="stylesheet" href="../lib/purchase.css">
</head>
<body>
  <header class="head">
    <div id="sigil" class="sigil-frame" aria-hidden="true"></div>
    <div class="brand"><h1 id="title"></h1><p class="sub">SHIELDED NAKAS · BLOCK ESTIMATES</p></div>
    <div id="langSwitch" class="segmented" role="group" aria-label="Language / 语言">
      <button type="button" data-lang="zh">中文</button><button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <section class="live-section live-primary">
    <label class="row row--switch" for="liveToggle">
      <span class="switch-text"><span class="live-heading"><span id="liveTitle" class="row-title"></span><span id="syncMode" class="settings-mode" role="status" aria-live="polite"></span></span><span id="liveSub" class="row-sub"></span></span>
      <input id="liveToggle" class="switch" type="checkbox" role="switch" aria-labelledby="liveTitle" aria-describedby="liveState">
    </label>
    <p id="liveState" class="live-state"></p>
  </section>

  <main class="popup-scroll">
  <section class="snapshot-card" aria-labelledby="snapTitle">
    <div class="snapshot-head"><h2 id="snapTitle"></h2><span id="snapSource" class="source-chip"></span></div>
    <div class="height-line"><span id="heightLabel"></span><strong id="currentHeight"></strong></div>
    <p id="blockAge" class="block-age"></p>
    <p id="measureNote" class="estimate-note" role="note"></p>
    <dl id="snap" class="snapshot-stats"></dl>
  </section>

  <div id="launchInfo"></div>
  <section class="lookup-section" aria-labelledby="lookupTitle">
    <form id="lookupForm">
      <div class="lookup-form-head"><label id="lookupTitle" for="lookupNumber"></label><button id="lookupBack" class="text-btn" type="button" hidden></button></div>
      <div class="lookup-controls"><span class="lookup-prefix" aria-hidden="true">#</span><input id="lookupNumber" class="field" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="24"><button id="lookupBtn" class="btn" type="submit"></button></div>
    </form>
    <div id="lookupResult" aria-live="polite" hidden></div>
  </section>

  <details id="syncSettings" class="settings-section">
    <summary><span id="syncSettingsTitle"></span></summary>
  <section class="sync-section" aria-labelledby="syncTitle">
    <h2 id="syncTitle"></h2>
    <form id="syncForm">
      <input id="syncHeight" class="field" inputmode="numeric" autocomplete="off" spellcheck="false">
      <button id="syncBtn" class="btn" type="submit"></button>
    </form>
    <p id="syncStatus" class="footnote status" role="status" aria-live="polite" hidden></p>
    <details id="syncDiagnostic" class="diagnostic" hidden><summary id="syncDiagnosticTitle"></summary><p id="syncDetail" class="live-detail"></p></details>
    <p id="syncHint" class="footnote"></p>
    <button id="restore" class="text-btn" type="button" hidden></button>
  </section>

  <section class="live-diagnostics">
    <p id="liveKeep" class="live-keep" hidden></p>
    <details id="liveDiagnostic" class="diagnostic" hidden><summary id="liveDiagnosticTitle"></summary><p id="liveDetail" class="live-detail"></p></details>
    <p id="liveHint" class="footnote" hidden></p>
  </section>
  </details>

  <details class="rules-section">
    <summary id="rulesTitle"></summary>
    <p id="rulesCaveat" class="footnote"></p>
    <div class="row--stack"><p id="traitLabel" class="row-label"></p><div id="traitTiers" class="stats"></div></div>
    <div class="row--stack"><p id="numberLabel" class="row-label"></p><div id="numberTiers" class="stats"></div></div>
    <div class="row"><span id="capLabel"></span><span id="capValue" class="value"></span></div>
    <p id="listedNote" class="footnote"></p>
    <a id="source" class="text-btn" target="_blank" rel="noopener noreferrer"></a>
    <a id="zeroSource" class="text-btn" target="_blank" rel="noopener noreferrer"></a>
  </details>
  </main>
  <footer class="foot"><a id="open" target="_blank" rel="noopener noreferrer"></a></footer>
  <script src="../data/snapshot.js"></script><script src="../lib/rules.js"></script>
  <script src="../lib/tier.js"></script><script src="../lib/purchase.js"></script><script src="../lib/lookup.js"></script><script src="../lib/pixel.js"></script><script src="../lib/i18n.js"></script><script src="../lib/source.js"></script><script src="popup.js"></script>
</body>
</html>
