<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Naka Sigil</title>
  <link rel="stylesheet" href="popup.css"><link rel="stylesheet" href="../lib/purchase.css">
</head>
<body>
  <header class="head">
    <div id="sigil" class="sigil-frame" aria-hidden="true"></div>
    <div class="brand"><h1 id="title"></h1><p id="tagline" class="sub"></p></div>
    <div id="langSwitch" class="segmented" role="group" aria-label="Language / 语言">
      <button type="button" data-lang="zh">中文</button><button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <section class="live-section live-primary" aria-labelledby="liveTitle">
    <h2 id="liveTitle" class="sr-only"></h2>
    <div class="mode-line"><button id="lookupBack" class="lookup-back" type="button" hidden></button><div class="mode-options" role="group" aria-labelledby="liveTitle"><button id="modeLive" type="button"></button><button id="modeFixed" type="button"></button></div><p id="liveState" class="live-state" role="status"></p></div>
  </section>

  <main class="popup-scroll">
  <section class="snapshot-card" aria-labelledby="snapTitle">
    <div class="snapshot-head"><h2 id="snapTitle"></h2><span id="snapSource" class="source-chip"></span></div>
    <div class="height-line"><span id="heightLabel"></span><strong id="currentHeight"></strong></div>
    <p id="blockAge" class="block-age"></p>
    <p id="measureNote" class="estimate-note" role="note"></p>
    <dl id="snap" class="snapshot-stats"></dl>
  </section>

  <section class="lookup-section" aria-labelledby="lookupTitle">
    <form id="lookupForm">
      <label id="lookupTitle" class="px-title" for="lookupNumber"></label>
      <div class="lookup-controls"><span class="lookup-prefix" aria-hidden="true">#</span><input id="lookupNumber" class="field" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="24"><button id="lookupBtn" class="btn" type="submit"></button></div>
    </form>
    <div id="lookupResult" aria-live="polite" hidden></div>
  </section>

  <section class="ladder-section" aria-labelledby="ladderTitle">
    <div class="ladder-head"><h2 id="ladderTitle" class="px-title"></h2><span id="ladderUnit" class="ladder-unit"></span></div>
    <ol id="ladderRows" class="ladder-rows"></ol>
  </section>

  <details class="rules-section">
    <summary id="rulesTitle"></summary>
    <p id="rulesCaveat" class="footnote"></p>
    <div class="row--stack"><p id="traitLabel" class="row-label"></p><div id="traitTiers" class="stats"></div></div>
    <div class="row--stack"><p id="numberLabel" class="row-label"></p><div id="numberTiers" class="stats"></div></div>
    <div class="row"><span id="capLabel"></span><span id="capValue" class="value"></span></div>
    <p id="listedNote" class="footnote"></p>
    <a id="source" class="text-btn" target="_blank" rel="noopener noreferrer"></a>
    <a id="zeroSource" class="text-btn" target="_blank" rel="noopener noreferrer"></a>
  </details>
  </main>
  <footer class="foot"><button id="lookupCompare" class="lookup-compare" type="button" hidden></button><button id="compare" type="button"></button><a id="open" target="_blank" rel="noopener noreferrer"></a></footer>
  <dialog id="fixedDialog" aria-labelledby="fixedTitle">
    <h2 id="fixedTitle"></h2><p id="syncHint" class="footnote"></p>
    <div id="fixedControls"><form id="syncForm"><input id="syncHeight" class="field" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="12"><div class="fixed-actions"><button id="fixedCancel" class="text-btn" type="button"></button><button id="syncBtn" class="btn" type="submit"></button></div></form></div>
    <p id="syncStatus" class="footnote status" role="status" aria-live="polite" hidden></p>
  </dialog>
  <script src="../data/snapshot.js"></script><script src="../lib/rules.js"></script>
  <script src="../lib/tier.js"></script><script src="../lib/purchase.js"></script><script src="../lib/lookup.js"></script><script src="../lib/pixel.js"></script><script src="../lib/i18n.js"></script><script src="../lib/source.js"></script><script src="../lib/explore.js"></script><script src="../lib/explore-ui.js"></script><script src="popup.js"></script>
</body>
</html>
