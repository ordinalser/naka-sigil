ingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.0" fill="#141414" text-anchor="start" xml:space="preserve" font-weight="700">On its machine: tree · nfs · ciphertexts · mints · listings · checkpoints</text><text x="16.0" y="252.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13" fill="#141414" text-anchor="start" xml:space="preserve" font-weight="700">Reorg: back to a checkpoint</text><rect class="shadow" x="19" y="268" width="60" height="28" fill="#d9d2ea"/><rect x="16" y="265" width="60" height="28" fill="#dcfaf5" stroke="#141414" stroke-width="2"/><text x="46.0" y="283.7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#141414" text-anchor="middle" xml:space="preserve" font-weight="700">n</text><rect class="shadow" x="93" y="268" width="60" height="28" fill="#d9d2ea"/><rect x="90" y="265" width="60" height="28" fill="#eef0f5" stroke="#141414" stroke-width="2"/><text x="120.0" y="283.7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#5f6478" text-anchor="middle" xml:space="preserve" font-weight="700">n+1</text><rect class="shadow" x="93" y="304" width="60" height="28" fill="#d9d2ea"/><rect x="90" y="301" width="60" height="28" fill="#fff1dc" stroke="#141414" stroke-width="2"/><text x="120.0" y="319.7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#141414" text-anchor="middle" xml:space="preserve" font-weight="700">n+1′</text><rect class="shadow" x="167" y="304" width="60" height="28" fill="#d9d2ea"/><rect x="164" y="301" width="60" height="28" fill="#fff1dc" stroke="#141414" stroke-width="2"/><text x="194.0" y="319.7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#141414" text-anchor="middle" xml:space="preserve" font-weight="700">n+2</text><polyline points="102.0,279.0 138.0,279.0" fill="none" stroke="#e11d48" stroke-width="2" stroke-linejoin="miter"/><polyline points="76.0,279.0 90.0,279.0" fill="none" stroke="#141414" stroke-width="2" stroke-linejoin="miter"/><polyline points="76.0,279.0 83.0,279.0 83.0,315.0 90.0,315.0" fill="none" stroke="#141414" stroke-width="2" stroke-linejoin="miter"/><polyline points="150.0,315.0 158.0,315.0" fill="none" stroke="#141414" stroke-width="2" stroke-linejoin="miter"/><path d="M157,310v10l7,-5z" fill="#141414"/><text x="46.0" y="319.5" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" xml:space="preserve" font-weight="700">checkpoint</text><text x="16.0" y="351.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#5f6478" text-anchor="start" xml:space="preserve">n+1′: a new block, same height</text><rect class="shadow" x="235" y="242" width="272" height="138" fill="#d9d2ea"/><rect x="232" y="239" width="272" height="138" fill="#fff" stroke="#141414" stroke-width="2"/><text x="244.0" y="261.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13" fill="#141414" text-anchor="start" xml:space="preserve" font-weight="700">Digest v1 covers</text><text x="244.0" y="281.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#0f766e" text-anchor="start" xml:space="preserve">root, leaves · nfs · minted</text><text x="244.0" y="301.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.0" fill="#0f766e" text-anchor="start" xml:space="preserve">listings: state, piece, credits, price</text><text x="244.0" y="323.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13" fill="#141414" text-anchor="start" xml:space="preserve" font-weight="700">Leaves out</text><text x="244.0" y="343.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#5f6478" text-anchor="start" xml:space="preserve">ciphertexts · txids · locks</text><text x="244.0" y="363.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#5f6478" text-anchor="start" xml:space="preserve">payout scripts</text><text x="16.0" y="403.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13.5" fill="#141414" text-anchor="start" xml:space="preserve" font-weight="700">Compare full digests at the same block: same height, same hash</text><text x="16.0" y="423.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#5f6478" text-anchor="start" xml:space="preserve">Given the same Bitcoin chain, rules, verification key and start height</text></svg>