<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 6 504 431" role="img" aria-label="What the indexer checks, what the digest covers"><rect x="12" y="12" width="60.52" height="22" rx="3" fill="#2563eb"/><text x="42.3" y="27.5" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12" fill="#fff" text-anchor="middle" xml:space="preserve" font-weight="700">Card 08</text><text x="84.5" y="28.5" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="15" fill="#141414" text-anchor="start" xml:space="preserve" font-weight="700">What the indexer checks, what the digest covers</text><text x="16.0" y="50.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13" fill="#2563eb" text-anchor="start" xml:space="preserve" font-weight="700">A private send: its proof is checked with public data, no private keys</text><rect class="shadow" x="19" y="67" width="72.0625" height="93" fill="#d9d2ea"/><rect x="16" y="64" width="72.0625" height="93" fill="#fff1dc" stroke="#141414" stroke-width="2"/><rect x="16" y="64" width="72.1" height="24" fill="#ff9f1c" stroke="#141414" stroke-width="2"/><text x="52.0" y="80.5" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13" fill="#141414" text-anchor="middle" xml:space="preserve" font-weight="700">Read</text><text x="52.0" y="117.5" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#141414" text-anchor="middle" xml:space="preserve">Block</text><text x="52.0" y="136.5" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#141414" text-anchor="middle" xml:space="preserve">Envelope</text><polyline points="88.1,110.5 100.1,110.5" fill="none" stroke="#141414" stroke-width="2" stroke-linejoin="miter"/><path d="M99.0625,105.5v10l7,-5z" fill="#141414"/><rect class="shadow" x="109.0625