serif" font-size="12" fill="#5f6478" text-anchor="start" xml:space="preserve">seller signs the</text><text x="222.0" y="234.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12" fill="#5f6478" text-anchor="start" xml:space="preserve">claim, same tx allowed</text><rect class="shadow" x="403" y="181" width="106" height="48" fill="#d9d2ea"/><rect x="400" y="178" width="106" height="48" fill="#efe6ff" stroke="#141414" stroke-width="2"/><text x="453.0" y="197.4" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="10.0" fill="#141414" text-anchor="middle" xml:space="preserve" font-weight="700">Seller&#x27;s new note</text><text x="453.0" y="215.8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#9d174d" text-anchor="middle" xml:space="preserve" font-weight="700">CLAIM</text><polyline points="210.0,270.0 394.0,270.0" fill="none" stroke="#5f6478" stroke-width="2" stroke-dasharray="4 3" stroke-linejoin="miter"/><path d="M393,265v10l7,-5z" fill="#5f6478"/><text x="222.0" y="261.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13" fill="#141414" text-anchor="start" xml:space="preserve" font-weight="700">Way out: 1,008 blocks on</text><text x="222.0" y="287.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12" fill="#5f6478" text-anchor="start" xml:space="preserve">seller spends it</text><text x="222.0" y="302.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12" fill="#5f6478" text-anchor="start" xml:space="preserve">alone, then claims</text><rect class="shadow" x="403" y="249" width="106" height="48" fill="#d9d2ea"/><rect x="400" y="246" width="106" height="48" fill="#efe6ff" stroke="#141414" stroke-width="2"/><text x="453.0" y="265.4" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="10.0" fill="#141414" text-anchor="middle" xml:space="preserve" font-weight="700">Seller&#x27;s new note</text><text x="453.0" y="283.8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#5f6478" text-anchor="middle" xml:space="preserve" font-weight="700">CLAIM</text><rect x="14" y="146.0" width="180" height="112" fill="#fff" stroke="#141414" stroke-width="2"/><rect x="24" y="158.0" width="10" height="8" fill="#b45309"/><path d="M26,159.0v-3h1v-1h4v1h1v3" fill="none" stroke="#b45309" stroke-width="2"/><text x="40.0" y="165.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#141414" text-anchor="start" xml:space="preserve" font-weight="700">Who can spend this lock</text><text x="24.0" y="194.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#141414" text-anchor="start" xml:space="preserve">platform key: any time</text><text x="24.0" y="217.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#141414" text-anchor="start" xml:space="preserve">seller: after 1,008 blocks</text><text x="24.0" y="240.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.0" fill="#5f6478" text-anchor="start" xml:space="preserve">the note returns by CLAIM</text><rect x="14" y="314" width="492" height="60" fill="#fff" stroke="#141414" stroke-width="2"/><text x="26.0" y="337.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13" fill="#0f766e" text-anchor="start" xml:space="preserve" font-weight="700">Lock spent, no sale: the listing closes; the seller claims at once</text><text x="26.0" y="360.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="11.0" fill="#141414" text-anchor="start" xml:space="preserve">The price goes to the seller&#x27;s address; the buyer adds 2% (at least 1,000 sats)</text></svg>