" text-anchor="start" xml:space="preserve" font-weight="700">这四样装进同一个 OP_RETURN 信封（公开 v1 格式，共 462 字节）</text><text x="28.0" y="303.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#5f6478" text-anchor="start" xml:space="preserve">条宽不按比例；另有树根高度 4 字节、用掉和新买的额度 1 + 2 字节没画</text><text x="28.0" y="326.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#141414" xml:space="preserve"><tspan fill="#5b21b6" font-weight="700">证明 π：</tspan>旧票据在树上、A 有花费密钥、编号没变，不说是哪一张，还绑住信封正文</text><text x="28.0" y="346.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#141414" text-anchor="start" xml:space="preserve">索引器全部验过才记账；#4 只在两人的金库里，信封里没有编号</text><text x="28.0" y="371.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12" fill="#141414" xml:space="preserve"><tspan fill="#b45309" font-weight="700">钱袋拆分：</tspan>另用 SPLIT 信封，写在见证里，公开原钱袋号和每个新钱袋的数量</text></svg>