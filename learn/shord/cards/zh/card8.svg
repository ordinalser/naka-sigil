承诺</text><text x="333.4" y="146.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#141414" text-anchor="middle" xml:space="preserve">存下密文</text><polyline points="380.1,110.5 392.1,110.5" fill="none" stroke="#141414" stroke-width="2" stroke-linejoin="miter"/><path d="M391.09375,105.5v10l7,-5z" fill="#141414"/><rect class="shadow" x="401.09375" y="67" width="105.90625" height="93" fill="#d9d2ea"/><rect x="398.09375" y="64" width="105.90625" height="93" fill="#dcfaf5" stroke="#141414" stroke-width="2"/><rect x="398.09375" y="64" width="105.9" height="24" fill="#14b8a6" stroke="#141414" stroke-width="2"/><text x="451.0" y="80.5" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13" fill="#141414" text-anchor="middle" xml:space="preserve" font-weight="700">更新</text><text x="451.0" y="117.5" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#141414" text-anchor="middle" xml:space="preserve">记下这一块的</text><text x="451.0" y="136.5" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#141414" text-anchor="middle" xml:space="preserve">树根和叶子数</text><polyline points="199.2,157.0 199.2,175.0 209.2,175.0" fill="none" stroke="#e11d48" stroke-width="2" stroke-linejoin="miter"/><path d="M208.171875,170v10l7,-5z" fill="#e11d48"/><text x="221.2" y="179.5" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#be123c" text-anchor="start" xml:space="preserve" font-weight="700">有一项不过：记一条拒收，账本不动</text><rect x="16" y="195" width="488" height="30" fill="#dcfaf5" stroke="#141414" stroke-width="2"/><text x="26.0" y="215.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13" fill="#141414" text-anchor="start" xml:space="preserve" font-weight="700">存在本机：记录树 · 作废码 · 票据密文 · 铸造 · 挂单 · 检查点</text><text x="16.0" y="252.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13" fill="#141414" text-anchor="start" xml:space="preserve" font-weight="700">重组：退回还在主链上的检查点</text><rect class="shadow" x="19" y="268" width="60" height="28" fill="#d9d2ea"/><rect x="16" y="265" width="60" height="28" fill="#dcfaf5" stroke="#141414" stroke-width="2"/><text x="46.0" y="283.7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#141414" text-anchor="middle" xml:space="preserve" font-weight="700">n</text><rect class="shadow" x="93" y="268" width="60" height="28" fill="#d9d2ea"/><rect x="90" y="265" width="60" height="28" fill="#eef0f5" stroke="#141414" stroke-width="2"/><text x="120.0" y="283.7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#5f6478" text-anchor="middle" xml:space="preserve" font-weight="700">n+1</text><rect class="shadow" x="93" y="304" width="60" height="28" fill="#d9d2ea"/><rect x="90" y="301" width="60" height="28" fill="#fff1dc" stroke="#141414" stroke-width="2"/><text x="120.0" y="319.7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#141414" text-anchor="middle" xml:space="preserve" font-weight="700">n+1′</text><rect class="shadow" x="167" y="304" width="60" height="28" fill="#d9d2ea"/><rect x="164" y="301" width="60" height="28" fill="#fff1dc" stroke="#141414" stroke-width="2"/><text x="194.0" y="319.7" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#141414" text-anchor="middle" xml:space="preserve" font-weight="700">n+2</text><polyline points="102.0,279.0 138.0,279.0" fill="none" stroke="#e11d48" stroke-width="2" stroke-linejoin="miter"/><polyline points="76.0,279.0 90.0,279.0" fill="none" stroke="#141414" stroke-width="2" stroke-linejoin="miter"/><polyline points="76.0,279.0 83.0,279.0 83.0,315.0 90.0,315.0" fill="none" stroke="#141414" stroke-width="2" stroke-linejoin="miter"/><polyline points="150.0,315.0 158.0,315.0" fill="none" stroke="#141414" stroke-width="2" stroke-linejoin="miter"/><path d="M157,310v10l7,-5z" fill="#141414"/><text x="46.0" y="319.5" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12" fill="#0f766e" text-anchor="middle" xml:space="preserve" font-weight="700">检查点</text><text x="16.0" y="351.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#5f6478" text-anchor="start" xml:space="preserve">n+1′：同一高度换上来的另一块</text><rect class="shadow" x="235" y="242" width="272" height="118" fill="#d9d2ea"/><rect x="232" y="239" width="272" height="118" fill="#fff" stroke="#141414" stroke-width="2"/><text x="244.0" y="261.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13" fill="#141414" text-anchor="start" xml:space="preserve" font-weight="700">摘要 v1 盖住</text><text x="244.0" y="281.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#0f766e" text-anchor="start" xml:space="preserve">树根和叶子数 · 作废码 · 已铸编号</text><text x="244.0" y="301.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#0f766e" text-anchor="start" xml:space="preserve">挂单的状态、作品、额度和价格</text><text x="244.0" y="323.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13" fill="#141414" text-anchor="start" xml:space="preserve" font-weight="700">不含</text><text x="244.0" y="343.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#5f6478" text-anchor="start" xml:space="preserve">密文 · 交易号 · 挂单锁 · 收款脚本</text><text x="16.0" y="383.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13.5" fill="#141414" text-anchor="start" xml:space="preserve" font-weight="700">两台对账：在同一块上比完整的摘要，高度和区块哈希都一样</text><text x="16.0" y="403.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#5f6478" text-anchor="start" xml:space="preserve">前提：同一条比特币链、同一套规则和验证参数、同一个起始高度</text></svg>