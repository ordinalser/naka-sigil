<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 6 504 411" role="img" aria-label="索引器验什么，摘要盖住什么"><rect x="12" y="12" width="71.08" height="22" rx="3" fill="#2563eb"/><text x="47.5" y="27.5" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12" fill="#fff" text-anchor="middle" xml:space="preserve" font-weight="700">技术卡 08</text><text x="95.1" y="28.5" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="15" fill="#141414" text-anchor="start" xml:space="preserve" font-weight="700">索引器验什么，摘要盖住什么</text><text x="16.0" y="50.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13" fill="#2563eb" text-anchor="start" xml:space="preserve" font-weight="700">以私密转账为例：核对证明只用公开的数据和验证参数，不用任何人的私钥</text><rect class="shadow" x="19" y="67" width="95.65625" height="93" fill="#d9d2ea"/><rect x="16" y="64" width="95.65625" height="93" fill="#fff1dc" stroke="#141414" stroke-width="2"/><rect x="16" y="64" width="95.7" height="24" fill="#ff9f1c" stroke="#141414" stroke-width="2"/><text x="63.8" y="80.5" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13" fill="#141414" text-anchor="middle" xml:space="preserve" font-weight="700">读取</text><text x="63.8" y="117.5" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#141414" text-anchor="middle" xml:space="preserve">区块</text><text x="63.8" y="136.5" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#141414" text-anchor="middle" xml:space="preserve">SHORD 信封</text><polyline points="111.7,110.5 123.7,110.5" fill="none" stroke="#141414" stroke-width="2" stroke-linejoin="miter"/><path d="M122.65625,105.5v10l7,-5z" fill="#141414"/><rect class="shadow" x="132.65625" y="67" width="139.03125" height="93" fill="#d9d2ea"/><rect x="129.65625" y="64" width="139.03125" heigh