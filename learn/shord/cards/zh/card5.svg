 SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#141414" text-anchor="start" xml:space="preserve">平台钥匙：随时能花</text><text x="24.0" y="217.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#141414" text-anchor="start" xml:space="preserve">卖家取回密钥：满 1,008 块后</text><text x="24.0" y="240.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.0" fill="#5f6478" text-anchor="start" xml:space="preserve">作品回来，还要卖家签 CLAIM</text><rect x="14" y="314" width="492" height="60" fill="#fff" stroke="#141414" stroke-width="2"/><text x="26.0" y="337.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="13" fill="#0f766e" text-anchor="start" xml:space="preserve" font-weight="700">锁花掉却没成交：挂单关闭，卖家随时签 CLAIM 取回，不用等 1,008 块</text><text x="26.0" y="360.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#141414" text-anchor="start" xml:space="preserve">货款付到卖家自己的收款地址，平台费 2%（最低 1,000 sats）由买家另付</text></svg>