<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 6 504 388" role="img" aria-label="一份签名，算出全部钥匙"><rect x="12" y="12" width="71.08" height="22" rx="3" fill="#e11d48"/><text x="47.5" y="27.5" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12" fill="#fff" text-anchor="middle" xml:space="preserve" font-weight="700">技术卡 01</text><text x="95.1" y="28.5" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="15" fill="#141414" text-anchor="start" xml:space="preserve" font-weight="700">一份签名，算出全部钥匙</text><rect class="shadow" x="17" y="49" width="296" height="50" fill="#d9d2ea"/><rect x="14" y="46" width="296" height="50" fill="#eef0f5" stroke="#141414" stroke-width="2"/><text x="162.0" y="66.7" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="14.5" fill="#141414" text-anchor="middle" xml:space="preserve" font-weight="700">钱包对官网这段固定文字签名</text><text x="162.0" y="84.6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#5f6478" text-anchor="middle" xml:space="preserve">Ord Dropz shielded vault key v1 …</text><polyline points="162.0,96.0 162.0,104.0" fill="none" stroke="#141414" stroke-width="2" stroke-linejoin="miter"/><path d="M157,103h10l-5,7z" fill="#141414"/><rect class="shadow" x="17" y="113" width="296" height="32" fill="#d9d2ea"/><rect x="14" y="110" width="296" height="32" fill="#fff" stroke="#141414" stroke-width="2"/><text x="162.0" y="130.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12.5" fill="#141414" text-anchor="middle" xml:space="preserve">seed = SHA-256(&quot;shord/seed/v1&quot; ‖ sig)</text><rect x="324" y="46" width="182" height="96" fill="#dcfaf5" stroke="#141414" stroke-width="2"/><text x="336.0" y="70.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="14.5" fill="#0f766e" text-anchor="start" xml:space="preserve" font-weight="700">同一签名，同一金库</text><text x="336.0" y="94.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#141414" text-anchor="start" xml:space="preserve">同一钱包、同一账户</text><text x="336.0" y="113.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#141414" text-anchor="start" xml:space="preserve">和同一地址类型</text><text x="336.0" y="132.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#141414" text-anchor="start" xml:space="preserve">换了就是另一个空金库</text><polyline points="162.0,142.0 162.0,168.0" fill="none" stroke="#141414" stroke-width="2" stroke-linejoin="miter"/><polyline points="61.0,168.0 459.0,168.0" fill="none" stroke="#141414" stroke-width="2" stroke-linejoin="miter"/><text x="172.0" y="161.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#5f6478" text-anchor="start" xml:space="preserve">种子算出各把钥匙和地址</text><polyline points="61.0,168.0 61.0,176.0" fill="none" stroke="#141414" stroke-width="2" stroke-linejoin="miter"/><path d="M56.0,175h10l-5,7z" fill="#141414"/><rect class="shadow" x="17.0" y="185" width="94" height="54" fill="#d9d2ea"/><rect x="14.0" y="182" width="94" height="54" fill="#efe6ff" stroke="#141414" stroke-width="2"/><text x="61.0" y="204.7" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="14.5" fill="#141414" text-anchor="middle" xml:space="preserve" font-weight="700">花费密钥</text><text x="61.0" y="222.6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#5f6478" text-anchor="middle" xml:space="preserve">spend</text><text x="61.0" y="256.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#141414" text-anchor="middle" xml:space="preserve" font-weight="700">花掉票据</text><polyline points="160.5,168.0 160.5,176.0" fill="none" stroke="#141414" stroke-width="2" stroke-linejoin="miter"/><path d="M155.5,175h10l-5,7z" fill="#141414"/><rect class="shadow" x="116.5" y="185" width="94" height="54" fill="#d9d2ea"/><rect x="113.5" y="182" width="94" height="54" fill="#efe6ff" stroke="#141414" stroke-width="2"/><text x="160.5" y="204.7" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="14.5" fill="#141414" text-anchor="middle" xml:space="preserve" font-weight="700">查看密钥</text><text x="160.5" y="222.6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#5f6478" text-anchor="middle" xml:space="preserve">view</text><text x="160.5" y="256.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#141414" text-anchor="middle" xml:space="preserve" font-weight="700">解开密文</text><polyline points="260.0,168.0 260.0,176.0" fill="none" stroke="#141414" stroke-width="2" stroke-linejoin="miter"/><path d="M255.0,175h10l-5,7z" fill="#141414"/><rect class="shadow" x="216.0" y="185" width="94" height="54" fill="#d9d2ea"/><rect x="213.0" y="182" width="94" height="54" fill="#efe6ff" stroke="#141414" stroke-width="2"/><text x="260.0" y="204.7" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="14.5" fill="#141414" text-anchor="middle" xml:space="preserve" font-weight="700">取回密钥</text><text x="260.0" y="222.6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#5f6478" text-anchor="middle" xml:space="preserve">return</text><text x="260.0" y="256.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#141414" text-anchor="middle" xml:space="preserve" font-weight="700">取回挂单</text><polyline points="359.5,168.0 359.5,176.0" fill="none" stroke="#141414" stroke-width="2" stroke-linejoin="miter"/><path d="M354.5,175h10l-5,7z" fill="#141414"/><rect class="shadow" x="315.5" y="185" width="94" height="54" fill="#d9d2ea"/><rect x="312.5" y="182" width="94" height="54" fill="#fff1dc" stroke="#141414" stroke-width="2"/><text x="359.5" y="204.7" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="14.5" fill="#141414" text-anchor="middle" xml:space="preserve" font-weight="700">卖出收款</text><text x="359.5" y="222.6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#5f6478" text-anchor="middle" xml:space="preserve">payout</text><text x="359.5" y="256.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#141414" text-anchor="middle" xml:space="preserve" font-weight="700">这次挂单专用</text><polyline points="459.0,168.0 459.0,176.0" fill="none" stroke="#141414" stroke-width="2" stroke-linejoin="miter"/><path d="M454.0,175h10l-5,7z" fill="#141414"/><rect class="shadow" x="415.0" y="185" width="94" height="54" fill="#d9d2ea"/><rect x="412.0" y="182" width="94" height="54" fill="#fff1dc" stroke="#141414" stroke-width="2"/><text x="459.0" y="204.7" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="14.5" fill="#141414" text-anchor="middle" xml:space="preserve" font-weight="700">金库 BTC</text><text x="459.0" y="222.6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#5f6478" text-anchor="middle" xml:space="preserve">btc</text><text x="459.0" y="256.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#141414" text-anchor="middle" xml:space="preserve" font-weight="700">收 BTC、找零</text><polyline points="14.0,266.0 14.0,270.0 207.5,270.0 207.5,266.0" fill="none" stroke="#5f6478" stroke-width="1.5" stroke-linejoin="miter"/><text x="110.8" y="287.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#5f6478" text-anchor="middle" xml:space="preserve">种子直接算出</text><polyline points="213.0,266.0 213.0,270.0 406.5,270.0 406.5,266.0" fill="none" stroke="#5f6478" stroke-width="1.5" stroke-linejoin="miter"/><text x="309.8" y="287.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#5f6478" text-anchor="middle" xml:space="preserve">种子 + 这次挂单的作废码</text><polyline points="412.0,266.0 412.0,270.0 506.0,270.0 506.0,266.0" fill="none" stroke="#5f6478" stroke-width="1.5" stroke-linejoin="miter"/><text x="459.0" y="287.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#5f6478" text-anchor="middle" xml:space="preserve">种子 + 序号</text><rect x="14" y="302" width="296" height="78" fill="#ffe4e6" stroke="#141414" stroke-width="2"/><text x="26.0" y="327.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="14.5" fill="#be123c" text-anchor="start" xml:space="preserve" font-weight="700">签名泄露 = 金库交了出去</text><text x="26.0" y="349.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#141414" text-anchor="start" xml:space="preserve">能转走作品、取走金库的 BTC，</text><text x="26.0" y="368.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="12.5" fill="#141414" text-anchor="start" xml:space="preserve">看到你持有过哪些作品</text><rect x="324" y="302" width="182" height="78" fill="#dcfce7" stroke="#141414" stroke-width="2"/><text x="336.0" y="327.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="14.5" fill="#15803d" text-anchor="start" xml:space="preserve" font-weight="700">钱包自己的 BTC</text><text x="336.0" y="349.0" font-family="PingFang SC,Hiragino Sans GB,Noto Sans SC,Microsoft YaHei,sans-serif" font-size="14.5" fill="#15803d" text-anchor="start" xml:space="preserve" font-weight="700">不在其中</text>