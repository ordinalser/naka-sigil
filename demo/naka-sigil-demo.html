:root{color-scheme:dark;--ink:#eee8dd;--muted:#a49e95;--gold:#ffb348;--line:#35343c;--panel:#191a1f;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:#101115;color:var(--ink);font:14px/1.5 var(--mono)}
button,input,select{font:inherit}
button,a,select{touch-action:manipulation}
button,select{background:#222329;color:var(--ink);border:1px solid #56505c;padding:9px 13px;cursor:pointer;border-radius:0}
button:hover,button:focus-visible,select:focus-visible{border-color:var(--gold)}
button:disabled{opacity:.45;cursor:default}
button[aria-pressed=true]{background:#343024;color:#ffd99c;border-color:#b99861}
a{color:#c5b3e5;text-underline-offset:4px}
input{min-width:0;background:#0d0e10;color:var(--ink);border:0;padding:9px;width:155px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.ws-sr{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}

/* Navigation */
.ws-nav{max-width:1328px;margin:auto;display:flex;align-items:center;gap:16px;padding:13px 32px;border-bottom:1px solid var(--line)}
.ws-brand{display:flex;gap:10px;align-items:center;font-weight:800;color:var(--ink);text-decoration:none;font-size:18px;white-space:nowrap}
.ws-brand svg{width:25px;height:30px;color:var(--gold)}
.ws-chip{color:#d8b57b;background:#2a241b;padding:3px 8px;font-size:11px}
.ws-lang{margin-left:auto;display:flex;gap:4px}
.ws-lang button{padding:4px 8px;font-size:12px}
.ws-nav>a:last-child{font-size:12px}
main{max-width:1280px;min-width:0;margin:auto;padding:22px 32px 40px}

/* Headline and one-line block basis: height, header age and mode share a single quiet row. */
.ws-hero{margin:0 0 18px}
h1{font-family:var(--mono);font-size:clamp(26px,3.2vw,38px);line-height:1.15;margin:0;font-weight:800;letter-spacing:-.055em}
#intro{color:var(--muted);margin:6px 0 12px;font-size:13px}
.ws-basis{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;margin:0;font-size:12px;color:var(--muted)}
.ws-block{display:inline-flex;align-items:center;gap:8px;color:var(--gold);font-weight:600}
.ws-block-number{display:inline-flex;align-items:center}
.ws-block-digits{display:block;height:15px;width:auto}
.ws-height-text{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.ws-age{padding-left:14px;border-left:1px solid #4a4650}
.ws-source{color:#d8b57b;border:1px solid #5d4c33;padding:0 7px;font-size:11px;line-height:20px}
.ws-demo-note{font-size:11px;color:#c7b097;margin:8px 0 0}

/* Comparison board: add/selection toolbar joined to the table it controls. */
.ws-board{background:var(--panel);border:1px solid var(--line);border-top:2px solid #bda471}
.ws-controls{display:flex;align-items:center;flex-wrap:wrap;gap:12px 20px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ws-controls form{flex:0 1 420px;min-width:0;margin:0}
.ws-field{display:flex;align-items:stretch;height:38px;background:#0d0e10;border:1px solid #56505c}
.ws-field:focus-within{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.ws-field>span{display:flex;align-items:center;padding:0 2px 0 12px;color:var(--gold)}
.ws-field input{flex:1;width:auto;padding:0 8px;background:transparent}
.ws-field input:focus-visible{outline:0}
.ws-field input::placeholder{color:#79746c}
.ws-field button{margin:-1px -1px -1px 0;padding:0 16px;background:var(--gold);border:0;color:#201708;font-weight:800;white-space:nowrap}
.ws-field button:hover{background:#ffc46e}
.ws-field button:focus-visible{outline:2px solid #201708;outline-offset:-5px}
.ws-selection{display:flex;align-items:center;gap:12px;margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.ws-pips{display:flex;gap:4px}
.ws-pips i{display:block;width:10px;height:10px;border:1px solid #6d6556}
.ws-pips i.is-on{background:var(--gold);border-color:var(--gold)}
.ws-text-btn{padding:4px 0;background:none;border:0;color:#c5b3e5;font-size:12px;text-decoration:underline;text-underline-offset:4px}
.ws-text-btn:disabled{text-decoration:none}
#status{margin:0;padding:8px 16px;color:#ffd08b;font-size:12px;border-bottom:1px solid var(--line)}
#status:empty{display:none}
.ws-scroll-hint{display:none;font-size:10px;color:#85817c;margin:0;padding:6px 16px 0}
#comparison{position:relative;min-width:0;max-width:100%;overflow-x:auto;scrollbar-color:#776b53 #202024}

/* Comparison table */
.ws-table{width:100%;border-collapse:collapse;table-layout:fixed}
.ws-table th,.ws-table td{padding:6px 16px;border-bottom:1px solid #302e35;text-align:left;vertical-align:top;font-weight:400;overflow-wrap:anywhere}
.ws-table td{line-height:1.35}
.ws-table tbody tr:last-child th,.ws-table tbody tr:last-child td{border-bottom:0}
.ws-table thead th{padding:10px 16px}
.ws-table .ws-label{width:136px;color:var(--muted);font-size:11px}
.ws-table thead .ws-label{vertical-align:bottom}
.ws-item{display:flex;align-items:center;gap:10px;position:relative}
.ws-item strong{display:block;font-size:16px}
.ws-item small{display:block;color:var(--muted);font-size:10px}
.ws-item-link{display:block;font-size:9px;color:#aaa093;margin-top:2px}
.ws-item .ws-remove{padding:2px 6px;margin-left:auto;align-self:start;font-size:14px;line-height:1.4;color:#9d968b;border:0;background:transparent}
.ws-item .naka-number-badge{margin-top:4px;font-size:10px}
.ws-image{display:block;flex-shrink:0;padding:0;border:0;background:#23252b;line-height:0;position:relative}
.ws-image:after{content:'';position:absolute;bottom:3px;right:3px;width:5px;height:5px;border-right:2px solid #ffd596;border-bottom:2px solid #ffd596}
.ws-image img,.ws-art-fallback{display:block;width:52px;height:52px;image-rendering:pixelated;object-fit:contain}
.ws-total td{background:#1c2026;padding-top:10px;padding-bottom:10px}
.ws-total .naka-weight{font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.05em;white-space:nowrap}
.ws-total .naka-weight__pixels{height:28px}
.ws-total .naka-weight__part{vertical-align:middle}
.ws-total .naka-weight__dash{display:inline-block;width:8px;height:28px;position:relative;vertical-align:middle}
.ws-total .naka-weight__rule{top:13px}
.ws-caption{display:block;font-size:10px;color:var(--muted);margin-bottom:5px}
.ws-table td small{display:block;color:#86827c;font-size:10px;line-height:1.35;margin-top:2px}
.ws-price td{font-size:19px;font-weight:700;color:#e9d3ac;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ws-before td{font-size:12px;color:#9d9ba0}
.ws-before .naka-weight{opacity:.75}
.ws-trait-guide th{font-size:10px;color:#948d80;background:#15161a;padding-top:7px;padding-bottom:7px}
.ws-trait-name{display:block;color:#aaa59e;font-size:11px;margin-bottom:3px;line-height:1.35}
.ws-bonus{font-size:13px;color:#d6cfc5;line-height:1.3;font-weight:600}
.ws-changed{background:#28251f;box-shadow:inset 2px 0 #bda471}
.ws-changed .ws-bonus{color:#9ee2b3;font-weight:800}
.ws-old{color:#8f887e;font-weight:400;font-size:11px}
.ws-changed[data-change=market] .ws-bonus{color:#9dccf2}
.ws-changed[data-change=unknown] .ws-bonus,.ws-changed[data-change=down] .ws-bonus{color:#ffd08a}
.ws-blank{padding:34px;min-height:180px;text-align:center;color:var(--muted)}
.ws-blank strong{display:block;color:var(--ink);font-size:18px}
.ws-blank button{margin-top:12px}
.ws-legend{font-size:10px;color:#bdb09a;margin:10px 0 4px}
.ws-assumption{font-size:10px;color:#99938a;margin:4px 0}
.ws-limits{font-size:10px;color:#c7a875;margin:4px 0}

/* Snapshot listings */
.ws-catalog{margin-top:30px}
.ws-section-head{display:flex;align-items:center;gap:16px}
.ws-section-head h2{font-size:16px;margin:0 auto 0 0}
.ws-section-head>span{font-size:11px;color:var(--muted)}
.ws-filter{font-size:11px;display:flex;gap:8px;align-items:center}
.ws-filter select{padding:5px 8px}
.ws-catalog>p{font-size:11px;color:var(--muted)}
.ws-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ws-candidate{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);background:#191a1f;min-width:0}
.ws-candidate strong{display:block;font-size:13px;color:#cfc6b5}
.ws-candidate .ws-ask{display:block;font-size:12px;font-weight:700;color:#e5c694;margin:3px 0 8px;white-space:nowrap}
.ws-candidate small{display:block;font-size:10px;color:var(--muted)}
.ws-candidate .naka-weight{display:block;font-size:18px;font-weight:800}
.ws-candidate>button{padding:4px 8px}
.ws-candidate .ws-image{padding:0}
.ws-candidate.is-selected{border-color:#b99861;box-shadow:inset 3px 0 #ffb348}
.ws-full-note{margin:-4px 0 10px;color:#ffd08b;font-size:11px}
#more{margin-top:12px}

/* Rule sources */
.ws-proof{border-top:1px solid var(--line);margin-top:32px;padding-top:20px;color:var(--muted);font-size:11px}
.ws-proof h2{font-size:13px;color:var(--ink)}
.ws-proof a{margin-right:20px}
.ws-proof p{margin:7px 0}

/* Enlarged artwork */
.ws-preview{position:fixed;z-index:1000;padding:12px;background:#191a1f;border:1px solid #a68b5f;box-shadow:6px 6px #0008;pointer-events:none}
.ws-preview[hidden]{display:none}
.ws-preview img,.ws-preview .ws-art-fallback{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:contain;image-rendering:pixelated;background:#0a0b0e}
